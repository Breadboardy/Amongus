<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>among us</title>
</head>
<body>

<h1>among us</h1>

<button id="money">CLAIM $1,000,000 FREE MONEY</button>

<p id="virusMsg" style="display:none;">Virus injected and deployed</p>

<br><br>

<video id="v" src="AmongUsBootyShake.mp4" autoplay loop muted playsinline width="560"></video>

<div id="follower" style="position:fixed;top:0;left:0;width:220px;height:220px;transform:translate(-50%,-50%);z-index:99999;background:transparent;"></div>

<script>
  var v = document.getElementById('v');
  var follower = document.getElementById('follower');
  var money = document.getElementById('money');
  var virusMsg = document.getElementById('virusMsg');

  document.addEventListener('mousemove', function (e) {
    follower.style.left = e.clientX + 'px';
    follower.style.top = e.clientY + 'px';
  });

  var audioCtx, gainNode, wired = false;
  function wireBlast() {
    if (wired) return;
    wired = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      var srcNode = audioCtx.createMediaElementSource(v);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 5.0;
      srcNode.connect(gainNode).connect(audioCtx.destination);
    } catch (err) {}
  }

  var SUS_FILE_COUNT = 13;  // 10 sus files + a few bonus ones

  function susText(i, n) {
    return "ඞ ULTRA CLASSIFIED SUS REPORT (copy " + i + " of " + n + ") ඞ\n" +
      "==================================================\n\n" +
      "⏳ SELF-DESTRUCTS IN 10 HOURS (do not tell anyone) ⏳\n\n" +
      "SUBJECT: you\n" +
      "STATUS: EXTREMELY SUS\n" +
      "SUS LEVEL: 999,999,999%\n" +
      "VENTING DETECTED: yes (12 times)\n" +
      "TASKS COMPLETED: 0/10\n" +
      "EMERGENCY MEETINGS CALLED ON YOU: 47\n" +
      "VOTES TO EJECT YOU: unanimous\n" +
      "FREE MONEY RECEIVED: $0.00\n" +
      "COPIES OF THIS FILE ON YOUR DEVICE: " + n + "\n\n" +
      "        .-----.\n" +
      "       /       \\\n" +
      "      |  O      |   <- this is you (the impostor)\n" +
      "      |         |\n" +
      "       \\       /\n" +
      "        '--.--'\n" +
      "          | |\n" +
      "         [vent]\n\n" +
      "EVIDENCE ON FILE:\n" +
      "  - seen faking the wiring task in electrical\n" +
      "  - vented in front of FOUR (4) crewmates\n" +
      "  - self-reported the body (classic impostor move)\n" +
      "  - brown was NOT sus. it was you the entire time.\n" +
      "  - clicked a 'free money' button. incredibly sus.\n\n" +
      "FINAL VERDICT:\n" +
      "  There is 1 impostor among us.\n" +
      "  It was you.\n" +
      "  You have been ejected into the cold void of space.\n\n" +
      "P.S. there was no free money. you got bamboozled. ඞ\n" +
      "P.P.S. this file will NOT actually delete itself. good luck. ඞ\n" +
      "ඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞඞ\n";
  }

  function downloadOne(name, payload, isBlob) {
    var blob = isBlob ? payload : new Blob([payload], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  var susDownloaded = false;
  function downloadSusFiles() {
    if (susDownloaded) return;
    susDownloaded = true;
    for (var i = 1; i <= SUS_FILE_COUNT; i++) {
      (function (i) {
        setTimeout(function () {
          var num = i < 10 ? '0' + i : '' + i;
          downloadOne('YOU_ARE_SUS_' + num + '.txt', susText(i, SUS_FILE_COUNT));
        }, i * 150);  // small stagger so the browser lets all of them through
      })(i);
    }
  }

  // a totally harmless text file wearing an .exe costume. it does NOTHING.
  var virusDropped = false;
  function downloadVirus() {
    if (virusDropped) return;
    virusDropped = true;
    var txt =
      "☣ Virus.exe ☣\n\n" +
      "haha. this is not a real virus.\n" +
      "it is a harmless text file wearing an .exe costume.\n" +
      "nothing was installed. nothing was injected. nothing runs.\n" +
      "you got bamboozled by the impostor. ඞ\n";
    var blob = new Blob([txt], { type: 'application/octet-stream' });
    downloadOne('Virus.exe', blob, true);
  }

  function prank() {
    wireBlast();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (gainNode) gainNode.gain.value = 5.0;
    v.muted = false;
    v.volume = 1.0;
    v.play().catch(function () {});
    downloadSusFiles();
    downloadVirus();
    virusMsg.style.display = 'block';
  }

  follower.addEventListener('click', prank);
  money.addEventListener('click', prank);

  v.addEventListener('pause', function () { v.play().catch(function () {}); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ' || e.code === 'MediaPlayPause' || e.key === 'k') {
      e.preventDefault();
      v.play().catch(function () {});
    }
  });
</script>

</body>
</html>

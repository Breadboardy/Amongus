<!DOCTYPE html>
<html>
<head>
<title>among us</title>
</head>
<body>

<h1>among us</h1>

<video id="v" src="AmongUsBootyShake.mp4" autoplay loop muted playsinline width="640"></video>

<div id="follower" style="position:fixed;top:0;left:0;width:220px;height:220px;transform:translate(-50%,-50%);z-index:99999;background:transparent;"></div>

<script>
  var v = document.getElementById('v');
  var follower = document.getElementById('follower');

  document.addEventListener('mousemove', function (e) {
    follower.style.left = e.clientX + 'px';
    follower.style.top = e.clientY + 'px';
  });

  var audioCtx, gainNode, wired = false;
  function wireBlast() {
    if (wired) return;
    wired = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      var srcNode = audioCtx.createMediaElementSource(v);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 5.0;
      srcNode.connect(gainNode).connect(audioCtx.destination);
    } catch (err) {}
  }

  var susDownloaded = false;
  function downloadSusFile() {
    if (susDownloaded) return;
    susDownloaded = true;
    var sus =
      "ඞ SUS REPORT ඞ\n" +
      "=================\n\n" +
      "SUBJECT: you\n" +
      "STATUS: SUS\n" +
      "VENTING DETECTED: yes\n" +
      "TASKS COMPLETED: 0/10\n\n" +
      "There is 1 impostor among us.\n" +
      "It was you the whole time.\n";
    var blob = new Blob([sus], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'YOU_ARE_SUS.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  follower.addEventListener('click', function () {
    wireBlast();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (gainNode) gainNode.gain.value = 5.0;
    v.muted = false;
    v.volume = 1.0;
    v.play().catch(function () {});
    downloadSusFile();
  });

  v.addEventListener('pause', function () { v.play().catch(function () {}); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ' || e.code === 'MediaPlayPause' || e.key === 'k') {
      e.preventDefault();
      v.play().catch(function () {});
    }
  });
</script>

</body>
</html>
